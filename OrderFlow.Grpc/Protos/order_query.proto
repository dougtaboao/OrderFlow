syntax = "proto3";

option csharp_namespace = "OrderFlow.Grpc.Protos";

package orderflow;

service OrderQuery {
  rpc GetOrderById (GetOrderByIdRequest) returns (GetOrderByIdResponse);
  rpc WatchOrderStatus (WatchOrderStatusRequest) returns (stream OrderStatusUpdate);
}

message GetOrderByIdRequest {
  string orderId = 1;
}

message GetOrderByIdResponse {
  string orderId = 1;
  string userId = 2;
  double amount = 3;
  string status = 4;
  string type = 5;
  string priority = 6;
  string externalReference = 7;
  string assetCode = 8;
  int32 quantity = 9;
  double unitPrice = 10;
  string sourceAccount = 11;
  string destinationAccount = 12;
  string createdAt = 13;

  repeated OrderEventResponse events = 14;
}

message OrderEventResponse {
  string type = 1;
  string description = 2;
  string createdAt = 3;
}

message WatchOrderStatusRequest {
  string orderId = 1;
}

message OrderStatusUpdate {
  string orderId = 1;
  string status = 2;
  string updatedAt = 3;
}