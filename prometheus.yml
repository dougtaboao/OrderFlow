global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "orderflow-api"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "orderflow-api:8080"
  - job_name: "orderflow-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "orderflow-worker:8080"
