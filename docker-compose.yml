services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: orderflow-sqlserver
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: "Y"
    ports:
      - "${SQL_PORT}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SA_PASSWORD}", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - orderflow-network

  redis:
    image: redis:latest
    container_name: orderflow-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - orderflow-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: orderflow-rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - orderflow-network

  kafka:
    image: apache/kafka:latest
    container_name: orderflow-kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - orderflow-network

  orderflow-grpc:
    build:
      context: .
      dockerfile: OrderFlow.Grpc/Dockerfile
    container_name: orderflow-grpc
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=OrderFlowDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"

      Redis__ConnectionString: "redis:6379"

      Kafka__BootstrapServers: "kafka:29092"

      RabbitMq__HostName: "rabbitmq"

      Serilog__WriteTo__1__Name: "Seq"
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:5341"

    depends_on:
      - sqlserver
      - redis
      - kafka
      - rabbitmq
      - seq

    networks:
      - orderflow-network
      
  orderflow-api:
    build:
      context: .
      dockerfile: OrderFlow.Api/Dockerfile
    container_name: orderflow-api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=OrderFlowDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Redis__ConnectionString: "redis:6379"
      Kafka__BootstrapServers: "kafka:29092"
      RabbitMq__HostName: "rabbitmq"
      Serilog__WriteTo__1__Name: "Seq"
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:5341"
    depends_on:
      - sqlserver
      - redis
      - kafka
      - rabbitmq
      - seq
    volumes:
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
    networks:
      - orderflow-network
      
  orderflow-worker:
    build:
      context: .
      dockerfile: OrderFlow.Worker/Dockerfile
    container_name: orderflow-worker
    environment:
      DOTNET_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=OrderFlowDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Redis__ConnectionString: "redis:6379"
      Kafka__BootstrapServers: "kafka:29092"
      RabbitMq__HostName: "rabbitmq"
      Messaging__Provider: "RabbitMq"
      Serilog__WriteTo__1__Name: "Seq"
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:5341"
    depends_on:
      - sqlserver
      - redis
      - kafka
      - rabbitmq
      - seq
    networks:
      - orderflow-network
      
  seq:
    image: datalust/seq:latest
    container_name: orderflow-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq_data:/data
    networks:
      - orderflow-network

volumes:
  sqlserver_data:
  redis_data:
  rabbitmq_data:
  kafka_data:
  seq_data:
  dataprotection_keys:

networks:
  orderflow-network:
    driver: bridge