name: OrderFlow CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore OrderFlow.slnx

      - name: Build solution
        run: dotnet build OrderFlow.slnx --configuration Release --no-restore
        
      - name: Run tests
        run: dotnet test OrderFlow.slnx --configuration Release --no-build
        
      - name: Run tests with coverage
        run: dotnet test OrderFlow.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"