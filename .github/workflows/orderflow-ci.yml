name: OrderFlow CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "OrderFlow@123"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'OrderFlow@123' -Q 'SELECT 1' -C"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s
          
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 60s

    env:
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=OrderFlowTestsDb;User Id=sa;Password=OrderFlow@123;TrustServerCertificate=True;"
      Redis__ConnectionString: localhost:6379,abortConnect=false
      Redis__OrderCacheExpirationMinutes: 5
      RabbitMq__HostName: localhost
      RabbitMq__QueueName: order-created
      RabbitMq__DeadLetterQueueName: order-created-dlq
      RabbitMq__MaxRetryCount: 3
      Kafka__BootstrapServers: localhost:9092
      Kafka__OrderCreatedTopic: order-created-test
      Kafka__ConsumerGroup: orderflow-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore OrderFlow.slnx

      - name: Build solution
        run: dotnet build OrderFlow.slnx --configuration Release --no-restore

      - name: Run tests with coverage
        run: dotnet test OrderFlow.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"
  
  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build API Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/orderflow-api:latest -f OrderFlow.Api/Dockerfile .

      - name: Build Worker Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/orderflow-worker:latest -f OrderFlow.Worker/Dockerfile .

      - name: Build gRPC Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/orderflow-grpc:latest -f OrderFlow.Grpc/Dockerfile .

      - name: Push API Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/orderflow-api:latest

      - name: Push Worker Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/orderflow-worker:latest

      - name: Push gRPC Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/orderflow-grpc:latest